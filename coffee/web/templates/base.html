<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}coffee{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">&#9749; coffee</a>
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Feed</a>
    <a href="/weekly" {% if request.url.path == '/weekly' %}class="active"{% endif %}>Weekly</a>
    <a href="/status" {% if request.url.path == '/status' %}class="active"{% endif %}>Status</a>
  </nav>
  {% if refreshing %}<span class="pill busy">refreshing…</span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
