[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee"
version = "0.1.0"
description = "Personal agentic-AI news viewer"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coffee = "coffee.cli:main"

[tool.setuptools]
packages = ["coffee", "coffee.sources", "coffee.web"]

[tool.setuptools.package-data]
"coffee.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
